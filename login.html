<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela De Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="preload" href="assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <script src="assets/js/pages/login.js"></script>
    <link rel="stylesheet" href="assets/css/login.css">




</head>
<body>



    <main class="container">

    <h1 id="titulo">Tela de login</h1>


     <!-- aqui entrara os input box de usuario e senha  -->
    <div class="input-box">
        <input placeholder="Digite seu usuário" type="email" id="usuario">
        <i class='bx bxs-user'></i>
    </div>

    <div class="input-box">
        <input placeholder="Digite sua senha" type="password" id="senha">
        <i class='bx bxs-lock-alt'></i>
    </div>

    <div class="remember-forgot">  
        <label><input type="checkbox">
            Lembrar Senha   
        </label>
        <a href="#">Esqueci a senha</a>    <!-- não temos ainda um metodo de recuperação --> 
    </div>

     <!-- botão de logar -->
        <button type="submit"  class="entrar" id="logar"  onclick="logar()">Entrar</button > 

    </form>
    </main>

    
    
</body>
</html>
